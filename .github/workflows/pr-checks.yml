name: PR checks

# Every pull request, on GitHub-hosted runners (free for public repos), never on ops01:
# the self-hosted runner is reserved for workflows triggered by pushes to main, i.e. only after
# someone has reviewed and merged. No approvals needed here: nothing is deployed.
#
#   lint       : yamllint, ansible syntax-check + ansible-lint, shellcheck
#   repo-scan  : Trivy: secrets, misconfigurations (Kubernetes, Ansible, ...), dependency vulnerabilities
#   quality    : one summary check that fails if any of the above failed (make THIS the required check)
#
# Apps (and their tests and image builds) live in zulhardy-lab/devops-projects.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python (ansible-core 2.22 needs >= 3.13)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install pinned lint tools
        run: |
          pip install ansible-core==2.22.0 ansible-lint==26.11.1 yamllint==1.38.0
          # shellcheck from Ubuntu's signed archive (usually already on the runner image)
          command -v shellcheck >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }

      - name: Lint
        run: bash scripts/lint.sh

  repo-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Security scan (repo)
        run: bash scripts/security-scan.sh repo

  quality:
    needs: [lint, repo-scan]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All checks passed?
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "${RESULTS}" | python3 -I -c '
          import json, sys
          bad = {k: v["result"] for k, v in json.load(sys.stdin).items() if v["result"] not in ("success", "skipped")}
          print("Failed:", bad) if bad else print("All checks passed.")
          sys.exit(1 if bad else 0)'
