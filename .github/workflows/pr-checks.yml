name: PR checks

# Runs on GitHub-hosted runners (free for public repos), never on docker01.
# The self-hosted runner is reserved for workflows triggered by pushes to main,
# i.e. only after a human has reviewed and merged.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python (ansible-core 2.22 needs >= 3.13)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install pinned lint tools
        run: pip install ansible-core==2.22.0 ansible-lint==26.11.1 yamllint==1.38.0

      - name: Lint
        run: bash scripts/lint.sh
