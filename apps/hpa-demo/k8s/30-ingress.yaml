# Load balancing from outside: Traefik (built into k3s) receives traffic on port 80 of both VMs
# and forwards it to the Service.
# The host name is filled in by scripts/hpa-demo.sh (HPA_DEMO_HOST). Uses the Traefik ingress built into k3s.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hpa-demo
  namespace: hpa-demo
spec:
  ingressClassName: traefik
  rules:
    - host: REPLACED_BY_SCRIPT
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hpa-demo
                port:
                  name: http
