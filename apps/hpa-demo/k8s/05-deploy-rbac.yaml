# Who may deploy hpa-demo, and how.
# Applied once by an admin (scripts/openbao-setup.sh), not by the pipeline.
#
# deployer       : the account the pipeline acts as. Can only manage the app's objects in this namespace.
#                  No secrets, no deletes, nothing outside hpa-demo.
# openbao-broker : may only create short-lived tokens for "deployer" (nothing else).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: hpa-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: hpa-demo
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer
  namespace: hpa-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployer
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: hpa-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-mint-deployer-token
  namespace: hpa-demo
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    resourceNames: ["deployer"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["deployer"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-mint-deployer-token
  namespace: hpa-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openbao-mint-deployer-token
subjects:
  - kind: ServiceAccount
    name: openbao-broker
    namespace: openbao
