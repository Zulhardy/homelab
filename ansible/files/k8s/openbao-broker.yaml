# Kubernetes identities used through OpenBao. Applied by scripts/bootstrap-automation.sh.
#
# openbao-broker   : the account OpenBao itself uses to mint short-lived tokens. Its token is stored inside
#                    OpenBao. It can do nothing except mint tokens for the accounts that explicitly allow it.
# homelab-platform : the pipeline's ADMIN account (cluster-admin), used only to onboard new apps
#                    (namespace + deployer account). The pipeline gets 10-minute tokens for it through OpenBao.
#                    Accepted trade-off: merging to main can change anything in the cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: openbao
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-broker
  namespace: openbao
---
apiVersion: v1
kind: Secret
metadata:
  name: openbao-broker-token
  namespace: openbao
  annotations:
    kubernetes.io/service-account.name: openbao-broker
type: kubernetes.io/service-account-token
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homelab-platform
  namespace: openbao
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homelab-platform-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: homelab-platform
    namespace: openbao
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-mint-platform-token
  namespace: openbao
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    resourceNames: ["homelab-platform"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["homelab-platform"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-mint-platform-token
  namespace: openbao
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openbao-mint-platform-token
subjects:
  - kind: ServiceAccount
    name: openbao-broker
    namespace: openbao
