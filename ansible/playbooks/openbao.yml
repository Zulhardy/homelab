---
# Installs and configures OpenBao (secrets vault) on ops01.
# - API listens ONLY on 127.0.0.1:8200 (not reachable from the network), with TLS.
# - Admin socket /run/openbao/admin.sock (openbao user only, reachable via sudo): allows creating a new root
#   token from 2 recovery keys. OpenBao 2.5.4+ blocks this on normal listeners by default.
# - Auto-unseal with a static key file (/etc/openbao/seal/homelab-1.key), created once, never overwritten.
#   BACK IT UP (see docs/OPENBAO.md). Switching an existing vault to it needs a one-time migration
#   (scripts/bootstrap-automation.sh does that).
# - Does NOT initialise OpenBao: that produces the recovery keys, which only the human handles.
- name: Install OpenBao
  hosts: control
  become: true
  vars:
    openbao_deb: "openbao_{{ openbao_version }}_linux_amd64.deb"
  tasks:
    - name: Download OpenBao package (checksum verified)
      ansible.builtin.get_url:
        url: "https://github.com/openbao/openbao/releases/download/v{{ openbao_version }}/{{ openbao_deb }}"
        dest: "/var/cache/{{ openbao_deb }}"
        checksum: "sha256:{{ openbao_deb_sha256 }}"
        mode: "0644"

    - name: Install OpenBao package
      ansible.builtin.apt:
        deb: "/var/cache/{{ openbao_deb }}"
        state: present

    - name: Create seal key directory (openbao user only)
      ansible.builtin.file:
        path: /etc/openbao/seal
        state: directory
        owner: openbao
        group: openbao
        mode: "0700"

    - name: Create the static auto-unseal key ONCE (32 random bytes; never overwritten)
      ansible.builtin.shell:
        cmd: umask 077 && head -c 32 /dev/urandom > /etc/openbao/seal/homelab-1.key
        creates: /etc/openbao/seal/homelab-1.key

    - name: Restrict the seal key to the openbao user, read-only
      ansible.builtin.file:
        path: /etc/openbao/seal/homelab-1.key
        owner: openbao
        group: openbao
        mode: "0400"

    - name: Create systemd drop-in directory for OpenBao
      ansible.builtin.file:
        path: /etc/systemd/system/openbao.service.d
        state: directory
        mode: "0755"

    - name: Systemd drop-in for OpenBao (runtime directory for the admin socket)
      ansible.builtin.copy:
        dest: /etc/systemd/system/openbao.service.d/homelab.conf
        mode: "0644"
        content: |
          # Managed by Ansible (homelab repo)
          [Service]
          RuntimeDirectory=openbao
          RuntimeDirectoryMode=0750
      notify: Restart OpenBao

    - name: Create a TLS certificate valid for 127.0.0.1 and localhost
      # The package's own certificate has no subject alternative names, so clients can't verify it.
      ansible.builtin.command:
        cmd: >-
          openssl req -x509 -newkey rsa:4096 -sha256 -nodes -days 1095
          -subj "/O=homelab/CN=openbao.localhost"
          -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          -keyout /opt/openbao/tls/tls.key -out /opt/openbao/tls/tls.crt
        creates: /opt/openbao/tls/.homelab-san-cert
      notify: Restart OpenBao

    - name: Mark certificate as replaced
      ansible.builtin.file:
        path: /opt/openbao/tls/.homelab-san-cert
        state: touch
        owner: openbao
        group: openbao
        mode: "0600"
        modification_time: preserve
        access_time: preserve

    - name: Restrict TLS files to the openbao user
      ansible.builtin.file:
        path: "/opt/openbao/tls/{{ item }}"
        owner: openbao
        group: openbao
        mode: "0600"
      loop:
        - tls.key
        - tls.crt

    - name: Publish the certificate (public part only) so clients can verify the server
      ansible.builtin.copy:
        src: /opt/openbao/tls/tls.crt
        dest: /etc/openbao/tls-ca.crt
        remote_src: true
        owner: root
        group: root
        mode: "0644"

    - name: Write OpenBao server config
      ansible.builtin.copy:
        dest: /etc/openbao/openbao.hcl
        owner: openbao
        group: openbao
        mode: "0640"
        content: |
          # Managed by Ansible (homelab repo)
          ui = true

          storage "pebbledb" {
            path = "/opt/openbao/data"
          }

          # Loopback only: only processes on ops01 (you, the runner) can reach it.
          listener "tcp" {
            address       = "127.0.0.1:8200"
            tls_cert_file = "/opt/openbao/tls/tls.crt"
            tls_key_file  = "/opt/openbao/tls/tls.key"
          }

          # Admin socket: only the openbao user (and root, via sudo) can connect.
          # Re-enables the root-token generation endpoints here only (blocked by default since 2.5.4).
          listener "unix" {
            address     = "/run/openbao/admin.sock"
            socket_mode = "0600"
            disable_unauthed_generate_root_endpoints = false
          }

          # Auto-unseal from a key file on ops01 (accepted trade-off: root on ops01 can open the vault).
          seal "static" {
            current_key_id = "homelab-1"
            current_key    = "file:///etc/openbao/seal/homelab-1.key"
          }

          api_addr = "{{ openbao_addr }}"
      notify: Restart OpenBao

    - name: Set client defaults for everyone on ops01 (address + certificate, no secrets)
      ansible.builtin.copy:
        dest: /etc/profile.d/openbao.sh
        mode: "0644"
        content: |
          export BAO_ADDR="{{ openbao_addr }}"
          export BAO_CACERT=/etc/openbao/tls-ca.crt

    - name: Apply pending restarts now (so the status check below sees the new certificate)
      ansible.builtin.meta: flush_handlers

    - name: Enable and start OpenBao
      ansible.builtin.systemd_service:
        name: openbao
        enabled: true
        state: started

    - name: Read OpenBao status (sealed / initialised)
      ansible.builtin.command: bao status -format=json
      environment:
        BAO_ADDR: "{{ openbao_addr }}"
        BAO_CACERT: /etc/openbao/tls-ca.crt
      register: bao_status
      changed_when: false
      # Exit code 2 = sealed, which is expected before you initialise and unseal it.
      failed_when: bao_status.rc not in [0, 2]
      retries: 5
      delay: 3
      until: bao_status.rc in [0, 2]
      when: not ansible_check_mode

    - name: Show status
      ansible.builtin.debug:
        msg: >-
          OpenBao is {{ 'initialised' if (bao_status.stdout | from_json).initialized else 'NOT initialised yet' }}
          and {{ 'sealed' if (bao_status.stdout | from_json).sealed else 'unsealed' }}
          (seal type: {{ (bao_status.stdout | from_json).type }}{{ migration_note }}).
      vars:
        migration_note: >-
          {{ ', MIGRATION PENDING: run scripts/bootstrap-automation.sh'
             if (bao_status.stdout | from_json).migration | default(false) else '' }}
      when: not ansible_check_mode

  handlers:
    - name: Restart OpenBao
      ansible.builtin.systemd_service:
        name: openbao
        state: restarted
        daemon_reload: true
