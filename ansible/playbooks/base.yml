---
# Basics for every homelab VM: supported OS, and the hostname from the inventory
# (ops01 / prd01 / dev01). Runs first, before k3s.yml.
#
# Renaming a running k3s node makes it join as a NEW node; the old node entry has to be removed
# by you afterwards (docs/K3S.md, "Renaming nodes"). k3s.yml pins the node name to the inventory
# name, so this only happens when the inventory name changes.

- name: Base setup
  hosts: homelab
  become: true
  tasks:
    - name: Stop if a host is not Ubuntu 26.04 (pinned versions are built for it)
      ansible.builtin.assert:
        that:
          - ansible_facts["distribution"] == "Ubuntu"
          - ansible_facts["distribution_version"] == "26.04"
        fail_msg: >-
          This homelab targets Ubuntu 26.04; {{ inventory_hostname }} is
          {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}

    - name: Map the new hostname to 127.0.1.1 first (keeps sudo from complaining during the rename)
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\s'
        line: "127.0.1.1 {{ inventory_hostname }}"
        owner: root
        group: root
        mode: "0644"

    - name: Set the hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"
        use: systemd

    # Leftover from when Docker was used on the VMs: a Docker apt source whose signing key is gone makes
    # every `apt update` fail (NO_PUBKEY). Only touched when Docker isn't installed, and moved aside, not deleted.
    - name: Check whether Docker (docker-ce) is installed
      ansible.builtin.command: dpkg-query -W -f='${Status}' docker-ce
      register: base_docker_pkg
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Find leftover Docker apt sources
      ansible.builtin.stat:
        path: "/etc/apt/sources.list.d/{{ item }}"
      loop: [docker.sources, docker.list]
      register: base_docker_sources

    - name: Make a folder for disabled apt sources
      ansible.builtin.file:
        path: /root/apt-disabled
        state: directory
        owner: root
        group: root
        mode: "0700"
      when:
        - "'install ok installed' not in base_docker_pkg.stdout"
        - base_docker_sources.results | selectattr('stat.exists') | list | length > 0

    - name: Move leftover Docker apt sources to /root/apt-disabled
      ansible.builtin.command:
        cmd: "mv /etc/apt/sources.list.d/{{ item.item }} /root/apt-disabled/{{ item.item }}"
        removes: "/etc/apt/sources.list.d/{{ item.item }}"
      loop: "{{ base_docker_sources.results }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - "'install ok installed' not in base_docker_pkg.stdout"
        - item.stat.exists

- name: Runner user has no root-equivalent groups
  hosts: control
  become: true
  tasks:
    - name: Read the runner user's groups
      ansible.builtin.command: "id -nG {{ runner_user }}"
      register: base_runner_groups
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Take the runner user out of the docker group (Docker is no longer used on the VMs)
      ansible.builtin.command: "gpasswd -d {{ runner_user }} docker"
      when:
        - base_runner_groups.rc == 0
        - "'docker' in base_runner_groups.stdout.split()"
      changed_when: true
