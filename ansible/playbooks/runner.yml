---
# Installs the GitHub Actions self-hosted runner on ops01 as a dedicated, non-root user, registered at
# organization level (runner_org_url), so it serves every repo in the org.
# The registration token is short-lived and typed in by you at run time; it is never stored.
- name: Install GitHub Actions self-hosted runner
  hosts: control
  become: true
  vars_prompt:
    - name: runner_token
      prompt: "Paste the runner registration token (GitHub organization > Settings > Actions > Runners > New runner)"
      private: true
  vars:
    runner_tarball: "actions-runner-linux-x64-{{ runner_version }}.tar.gz"
  tasks:
    - name: Install CI tools used by the pipelines
      ansible.builtin.apt:
        name:
          - acl # provides setfacl; Ansible needs it to run tasks as the unprivileged runner user
          - ansible-lint
          - yamllint
          - git
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create runner user (no extra groups, in particular NOT docker, which is root-equivalent)
      ansible.builtin.user:
        name: "{{ runner_user }}"
        shell: /bin/bash
        create_home: true

    - name: Check whether the runner user is still in the docker group (older setups)
      ansible.builtin.command: "id -nG {{ runner_user }}"
      register: runner_groups
      changed_when: false
      check_mode: false

    - name: Take the runner user out of the docker group
      ansible.builtin.command: "gpasswd -d {{ runner_user }} docker"
      when: "'docker' in runner_groups.stdout.split()"
      changed_when: true

    - name: Create runner directory
      ansible.builtin.file:
        path: "{{ runner_dir }}"
        state: directory
        owner: "{{ runner_user }}"
        group: "{{ runner_user }}"
        mode: "0750"

    - name: Download runner release (checksum verified)
      ansible.builtin.get_url:
        url: "https://github.com/actions/runner/releases/download/v{{ runner_version }}/{{ runner_tarball }}"
        dest: "/tmp/{{ runner_tarball }}"
        checksum: "sha256:{{ runner_sha256 }}"
        mode: "0644"

    - name: Extract runner
      ansible.builtin.unarchive:
        src: "/tmp/{{ runner_tarball }}"
        dest: "{{ runner_dir }}"
        remote_src: true
        owner: "{{ runner_user }}"
        group: "{{ runner_user }}"
        creates: "{{ runner_dir }}/config.sh"

    - name: Install runner OS dependencies
      ansible.builtin.command: "{{ runner_dir }}/bin/installdependencies.sh"
      args:
        creates: "{{ runner_dir }}/.deps-installed"
      register: deps_out
      changed_when: deps_out.rc == 0

    - name: Mark dependencies installed
      ansible.builtin.file:
        path: "{{ runner_dir }}/.deps-installed"
        state: touch
        owner: "{{ runner_user }}"
        mode: "0644"
        modification_time: preserve
        access_time: preserve

    - name: Register runner with GitHub (runs as the runner user, not root)
      become: true
      become_user: "{{ runner_user }}"
      ansible.builtin.command:
        argv:
          - "{{ runner_dir }}/config.sh"
          - --unattended
          - --url
          - "{{ runner_org_url }}"
          - --token
          - "{{ runner_token }}"
          - --name
          - "{{ runner_name }}"
          - --labels
          - "{{ runner_labels }}"
          - --work
          - _work
        chdir: "{{ runner_dir }}"
        creates: "{{ runner_dir }}/.runner"
      no_log: true

    - name: Install runner as a systemd service
      ansible.builtin.command:
        cmd: "./svc.sh install {{ runner_user }}"
        chdir: "{{ runner_dir }}"
        creates: "{{ runner_dir }}/.service"

    - name: Start runner service
      ansible.builtin.command:
        cmd: ./svc.sh start
        chdir: "{{ runner_dir }}"
      changed_when: false # svc.sh start is safe to repeat

    - name: Remove downloaded tarball
      ansible.builtin.file:
        path: "/tmp/{{ runner_tarball }}"
        state: absent
