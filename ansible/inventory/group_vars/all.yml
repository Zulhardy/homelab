---
# GitHub Actions self-hosted runner (pinned version + checksum).
# Checksum computed from the release tarball on 2026-11-26.
runner_version: "2.338.2"
runner_sha256: "baebf204307bac6193480852732f0aba2ae97b6c5597c244f4d5558390147c40"
runner_user: gha-runner
runner_dir: /opt/actions-runner
runner_name: ops01
runner_labels: "homelab,ops01"

# Registered at ORGANIZATION level, so one runner serves every repo in the org (homelab and devops-projects).
# The org's runner group must allow public repositories (docs/BOOTSTRAP.md, step 6).
runner_org_url: "https://github.com/zulhardy-lab"

# Allowed apps: the ONLY apps the platform onboards (namespaces <app>-dev / <app>-prd, deployer accounts,
# OpenBao roles dev-<app> / prd-<app>). Applied by the homelab pipeline (scripts/ci-homelab.sh) after the playbooks,
# so adding a name here needs the "platform" approval. The apps themselves live in zulhardy-lab/devops-projects,
# which can only deploy what is listed here. Removing a name does NOT remove the app: that's a manual step.
# Names: lowercase letters, digits, "-", max 40 characters.
homelab_apps: [hpa-demo]  # apps from zulhardy-lab/devops-projects allowed to deploy to DEV and PRD

# k3s (lightweight Kubernetes), pinned version + checksum.
# Checksum from the release's sha256sum-amd64.txt, and re-computed from the binary, on 2026-11-26.
k3s_version: "v1.37.2+k3s1"
k3s_sha256: "265b3ee6a3198ef14033c63ef46cbb32370d83795199fb6d1b01f21575eddbda"
k3s_server_ip: "192.168.0.102"
k3s_admin_user: zulhardy # gets a kubeconfig on ops01 (cluster admin)

# OpenBao (secrets vault) on ops01, official .deb from the GitHub release, pinned + checksum.
# Checksum from the release's checksums.txt, and re-computed from the .deb, on 2026-11-26.
openbao_version: "2.7.3"
openbao_deb_sha256: "0800c71469c1d7a5d5c9fb37ce0e441cad97d9fe122dab70391c8371e290b935"
openbao_addr: "https://127.0.0.1:8200"

# Pipeline access to the VMs (see ansible/playbooks/automation-access.yml)
automation_user: automation
automation_ssh_ca_mount: ssh-client-signer # OpenBao SSH engine that signs the pipeline's 10-minute certificates
