# Inventory used by the homelab PIPELINE (scripts/ci-homelab.sh), not by humans.
# Both VMs are reached over SSH as "automation", with a 10-minute certificate signed by OpenBao.
# Humans keep using hosts.ini (docker01 local, linux01 as zulhardy).

[control]
docker01 ansible_host=127.0.0.1 ansible_user=automation k3s_node_ip=192.168.0.102

[runtime]
linux01 ansible_host=192.168.0.103 ansible_user=automation k3s_node_ip=192.168.0.103

[homelab:children]
control
runtime

[k3s_server]
docker01

[k3s_agent]
linux01

[k3s_cluster:children]
k3s_server
k3s_agent
