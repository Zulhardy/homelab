# Inventory used by the homelab PIPELINE (scripts/ci-homelab.sh), not by you.
# Every VM is reached over SSH as "automation", with a 10-minute certificate signed by OpenBao.
# You keep using hosts.ini. Keep both files in step.

[control]
ops01 ansible_host=127.0.0.1 ansible_user=automation k3s_node_ip=192.168.0.102

[runtime]
prd01 ansible_host=192.168.0.103 ansible_user=automation k3s_node_ip=192.168.0.103 k3s_env=prd
dev01 ansible_host=192.168.0.104 ansible_user=automation k3s_node_ip=192.168.0.104 k3s_env=dev

[homelab:children]
control
runtime

[k3s_server]
ops01

[k3s_agent]
prd01
dev01

[k3s_cluster:children]
k3s_server
k3s_agent
