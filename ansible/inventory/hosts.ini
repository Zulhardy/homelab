# Inventory for you, at the keyboard on ops01. The pipeline uses automation.ini.
# All Ubuntu 26.04.1 LTS on Hyper-V, static IPs.
#   ops01 : operations: k3s control plane, GitHub runner, OpenBao, Ansible. No app pods.
#   prd01 : PRD apps only
#   dev01 (new) : DEV apps only
# k3s_env: which app environment may run on that node (enforced by Kubernetes, see docs/K3S.md).

[control]
ops01 ansible_connection=local k3s_node_ip=192.168.0.102

[runtime]
prd01 ansible_host=192.168.0.103 ansible_user=zulhardy k3s_node_ip=192.168.0.103 k3s_env=prd
dev01 ansible_host=192.168.0.104 ansible_user=zulhardy k3s_node_ip=192.168.0.104 k3s_env=dev

[homelab:children]
control
runtime

# Kubernetes (k3s): ops01 runs the control plane, prd01 and dev01 run the apps.
[k3s_server]
ops01

[k3s_agent]
prd01
dev01

[k3s_cluster:children]
k3s_server
k3s_agent
