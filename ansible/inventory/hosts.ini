# VM1 = docker01 (control node), VM2 = linux01 (app runtime). Both Ubuntu 26.04.1 LTS.
# Both IPs show "valid_lft forever", which suggests they are static; keep them fixed.

[control]
docker01 ansible_connection=local k3s_node_ip=192.168.0.102

[runtime]
linux01 ansible_host=192.168.0.103 ansible_user=zulhardy k3s_node_ip=192.168.0.103

[homelab:children]
control
runtime

# Kubernetes (k3s): docker01 runs the control plane, linux01 runs the workloads.
[k3s_server]
docker01

[k3s_agent]
linux01

[k3s_cluster:children]
k3s_server
k3s_agent
